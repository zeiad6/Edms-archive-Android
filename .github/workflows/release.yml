name: release

# Tag a version (v1.0.1) and this builds the signed, obfuscated release APK and
# attaches it to the GitHub release. The in-app updater (Updater.kt) reads the
# newest release from the desktop repo, so the same tag has to be published
# there too for phones to see the update.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Stage the release signing key
        env:
          EDMS_KEYSTORE_B64: ${{ secrets.EDMS_KEYSTORE_B64 }}
          EDMS_STORE_PASSWORD: ${{ secrets.EDMS_STORE_PASSWORD }}
          EDMS_KEY_ALIAS: ${{ secrets.EDMS_KEY_ALIAS }}
          EDMS_KEY_PASSWORD: ${{ secrets.EDMS_KEY_PASSWORD }}
        run: ./.github/scripts/restore-key.sh

      - name: Assemble signed release APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Verify the signature and the obfuscation
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk" | head -20
          unzip -o -q "$apk" 'classes*.dex' -d /tmp/dex
          cat /tmp/dex/*.dex > /tmp/release.dex
          # Only the two activities AGP keeps by name may survive; see build.yml.
          allowed='^(Lcom/zidex/edms/MainActivity;|Lcom/zidex/edms/remote/RemoteActivity(|\$[A-Za-z0-9_$]*);)$'
          leaked=$(strings -a /tmp/release.dex \
            | grep -a -o 'Lcom/zidex/edms[A-Za-z0-9_$/;]*' \
            | sort -u \
            | grep -a -v -E "$allowed" || true)
          if [ -n "$leaked" ]; then
            echo "::error::original class descriptors are still present in the release DEX"
            echo "$leaked" | head -40
            exit 1
          fi
          echo "::notice::release DEX carries no original class descriptors beyond the manifest components"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          gh release create "$TAG" "$apk" \
            --title "EDMS Android $TAG" \
            --generate-notes \
            || gh release upload "$TAG" "$apk" --clobber
          gh release view "$TAG"

      - name: Remove the signing material from the runner
        if: always()
        run: rm -f edms-release.jks keystore.properties
