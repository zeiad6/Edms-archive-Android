name: release

# Tag a version (v1.0.1) and this builds the signed, obfuscated release APK and
# attaches it to the GitHub release. The in-app updater (Updater.kt) reads the
# newest release from the desktop repo, so the same tag has to be published
# there too for phones to see the update.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fail early if the signing secrets are missing
        # A release APK that is not signed with the existing key cannot update
        # an installed app, so this stops before burning a build.
        env:
          KEYSTORE_B64: ${{ secrets.EDMS_KEYSTORE_B64 }}
        run: |
          if [ -z "${KEYSTORE_B64}" ]; then
            echo "::error::EDMS_KEYSTORE_B64 is not set. Add the base64 release key to the repository secrets before tagging."
            exit 1
          fi

      - name: Reassemble the release key
        run: |
          set -euo pipefail
          echo "${{ secrets.EDMS_KEYSTORE_B64 }}" | base64 -d > keystore.properties.b64.dec
          # keystore.properties is gitignored, so it exists only for this job.
          {
            echo "storeFile=edms-release.jks"
            echo "storePassword=${{ secrets.EDMS_STORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.EDMS_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.EDMS_KEY_PASSWORD }}"
          } > keystore.properties
          mv keystore.properties.b64.dec edms-release.jks
          chmod 600 edms-release.jks keystore.properties

      - name: Assemble signed release APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Verify the signature and the obfuscation
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk" | head -20
          unzip -p "$apk" 'classes*.dex' > /tmp/release.dex
          if grep -qa 'com/zidex/edms' /tmp/release.dex; then
            echo "::error::original package names are still present in the release DEX"
            exit 1
          fi
          echo "::notice::release DEX carries no original class names"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          gh release create "$TAG" "$apk" \
            --title "EDMS Android $TAG" \
            --generate-notes \
            || gh release upload "$TAG" "$apk" --clobber
          gh release view "$TAG"

      - name: Remove the signing material from the runner
        if: always()
        run: rm -f edms-release.jks keystore.properties
