name: build

# Every push and PR is built here, so a broken APK never reaches a release tag.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache the Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/transforms-*
            ~/.gradle/caches/build-cache-*
            ~/.android
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Unit tests (every variant's JVM tests)
        # Passwords/scrypt, version compare, the storage-key guard and the new
        # credential store are pure JVM tests — they run here, not on a device.
        run: ./gradlew --no-daemon --stacktrace test

      - name: Lint
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Stage the release signing key
        # From the repository secret only. app/build.gradle.kts then signs the
        # release build, so the APK this workflow publishes is installable.
        run: ./.github/scripts/restore-key.sh
        env:
          EDMS_KEYSTORE_B64: ${{ secrets.EDMS_KEYSTORE_B64 }}
          EDMS_STORE_PASSWORD: ${{ secrets.EDMS_STORE_PASSWORD }}
          EDMS_KEY_ALIAS: ${{ secrets.EDMS_KEY_ALIAS }}
          EDMS_KEY_PASSWORD: ${{ secrets.EDMS_KEY_PASSWORD }}

      - name: Assemble release APK (R8 + resource shrinking + signed)
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Remove the signing material
        if: always()
        run: rm -f edms-release.jks keystore.properties

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload the R8 mapping (needed to read any release crash)
        # Never a release asset: the mapping turns an obfuscated stack trace
        # back into source names, so it stays inside a 90-day artifact.
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: |
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/mapping/release/configuration.txt
          retention-days: 90

      - name: Check the release APK is signed
        run: ./.github/scripts/verify-release.sh

      - name: Check the release APK is actually obfuscated
        # The package name `com.zidex.edms` is public by construction (manifest,
        # Play Store, packageName at runtime) — it can never be hidden. What must
        # not survive is a *class name*: business logic like
        # Lcom/zidex/edms/data/Document; is exactly what makes the APK
        # reconstructable. AGP emits a strict `-keep class MainActivity` for
        # every manifest component, and those two cannot be overridden from
        # here, so they are the only allowed names.
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          unzip -o -q "$apk" 'classes*.dex' -d /tmp/dex
          cat /tmp/dex/*.dex > /tmp/release.dex

          allowed='^(Lcom/zidex/edms/MainActivity;|Lcom/zidex/edms/remote/RemoteActivity(|\$[A-Za-z0-9_$]*);)$'
          leaked=$(strings -a /tmp/release.dex \
            | grep -a -o 'Lcom/zidex/edms[A-Za-z0-9_$/;]*' \
            | sort -u \
            | grep -a -v -E "$allowed" || true)

          echo "### Obfuscation check" >> "$GITHUB_STEP_SUMMARY"
          echo "APK: \`$(basename "$apk")\` · $(du -h "$apk" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$leaked" ]; then
            {
              echo
              echo "**FAIL** — original class descriptors are still in the release DEX:"
              echo '```'
              echo "$leaked" | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$leaked" | head -40
            exit 1
          fi
          {
            echo
            echo "**PASS** — no original class descriptors in the release DEX."
            echo
            echo "Only these names survive, and only because AGP emits a strict keep for every manifest component:"
            echo '```'
            strings -a /tmp/release.dex | grep -a -o 'Lcom/zidex/edms[A-Za-z0-9_$/;]*' | sort -u | head -20 || echo "(none)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
