org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.suppressUnsupportedCompileSdk=35
android.nonTransitiveRClass=true
kotlin.code.style=official

# ── Code protection (release only) ───────────────────────────────────────────
# R8 full mode: drops the legacy compatibility behaviour, so shrinking and
# obfuscation are allowed to reach reflection, Kotlin metadata and records.
# This is what actually removes the source-level shape of the app from the APK.
android.enableR8.fullMode=true

# AAPT2 releases resource *names* and file *contents* in release builds, so
# res/drawable/ic_launcher_foreground.xml no longer ships under its own name.
android.enableResourceOptimizations=true
